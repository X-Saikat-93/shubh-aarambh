<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" fill="none">
  <!-- Main stem entering smoothly from left edge -->
  <path d="M 0,30 C 30,28 65,34 95,46 C 120,56 142,70 155,78" stroke="#852834" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Upper secondary branch -->
  <path d="M 48,31 C 68,22 92,18 120,20" stroke="#852834" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Lower secondary branch -->
  <path d="M 82,41 C 98,54 116,68 132,78" stroke="#852834" stroke-width="1.1" stroke-linecap="round" fill="none"/>

  <!-- Upper branch leaves -->
  <!-- Leaf 1 (top mid) -->
  <path d="M 66,25 C 70,14 80,10 88,14 C 92,20 86,28 76,27 Z" fill="#852834" fill-opacity="0.16" stroke="#852834" stroke-width="1.2"/>
  <path d="M 70,23 Q 78,17 84,15" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 2 (top upper) -->
  <path d="M 94,20 C 100,10 110,8 118,12 C 121,18 114,24 104,22 Z" fill="#852834" fill-opacity="0.18" stroke="#852834" stroke-width="1.2"/>
  <path d="M 98,19 Q 107,14 114,13" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 3 (top terminal) -->
  <path d="M 120,20 C 130,16 142,21 144,28 C 142,34 132,32 125,25 Z" fill="#852834" fill-opacity="0.22" stroke="#852834" stroke-width="1.2"/>
  <path d="M 122,21 Q 132,22 139,26" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Main stem leaves -->
  <!-- Leaf 4 (base upper) -->
  <path d="M 22,29 C 24,18 34,14 42,18 C 45,24 38,32 30,31 Z" fill="#852834" fill-opacity="0.14" stroke="#852834" stroke-width="1.2"/>
  <path d="M 26,27 Q 34,22 39,19" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 5 (base lower) -->
  <path d="M 32,31 C 34,42 44,46 52,43 C 55,37 47,30 38,30 Z" fill="#852834" fill-opacity="0.14" stroke="#852834" stroke-width="1.2"/>
  <path d="M 36,33 Q 44,38 49,41" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 6 (mid upper) -->
  <path d="M 88,43 C 94,32 106,30 114,35 C 116,42 108,48 98,46 Z" fill="#852834" fill-opacity="0.18" stroke="#852834" stroke-width="1.2"/>
  <path d="M 91,42 Q 102,37 110,37" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Lower branch leaves -->
  <!-- Leaf 7 (lower mid) -->
  <path d="M 102,56 C 106,66 116,72 124,68 C 126,62 119,55 110,54 Z" fill="#852834" fill-opacity="0.16" stroke="#852834" stroke-width="1.2"/>
  <path d="M 105,58 Q 114,64 120,67" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 8 (lower terminal) -->
  <path d="M 124,72 C 128,82 138,86 144,82 C 146,75 138,70 130,70 Z" fill="#852834" fill-opacity="0.2" stroke="#852834" stroke-width="1.2"/>
  <path d="M 127,73 Q 135,78 141,80" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Terminal leaf on main stem -->
  <path d="M 148,74 C 158,74 166,80 164,86 C 158,90 150,84 148,78 Z" fill="#852834" fill-opacity="0.24" stroke="#852834" stroke-width="1.2"/>
  <path d="M 150,76 Q 158,79 162,84" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Delicate accent buds -->
  <circle cx="60" cy="34" r="1.8" fill="#852834"/>
  <circle cx="106" cy="47" r="1.6" fill="#852834"/>
</svg>
