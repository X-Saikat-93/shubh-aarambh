<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" fill="none">
  <!-- Main stem entering smoothly from right edge (x=160) -->
  <path d="M 160,30 C 130,28 95,34 65,46 C 40,56 18,70 5,78" stroke="#852834" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Upper secondary branch -->
  <path d="M 112,31 C 92,22 68,18 40,20" stroke="#852834" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <!-- Lower secondary branch -->
  <path d="M 78,41 C 62,54 44,68 28,78" stroke="#852834" stroke-width="1.1" stroke-linecap="round" fill="none"/>

  <!-- Upper branch leaves -->
  <!-- Leaf 1 (top mid) -->
  <path d="M 94,25 C 90,14 80,10 72,14 C 68,20 74,28 84,27 Z" fill="#852834" fill-opacity="0.16" stroke="#852834" stroke-width="1.2"/>
  <path d="M 90,23 Q 82,17 76,15" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 2 (top upper) -->
  <path d="M 66,20 C 60,10 50,8 42,12 C 39,18 46,24 56,22 Z" fill="#852834" fill-opacity="0.18" stroke="#852834" stroke-width="1.2"/>
  <path d="M 62,19 Q 53,14 46,13" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 3 (top terminal) -->
  <path d="M 40,20 C 30,16 18,21 16,28 C 18,34 28,32 35,25 Z" fill="#852834" fill-opacity="0.22" stroke="#852834" stroke-width="1.2"/>
  <path d="M 38,21 Q 28,22 21,26" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Main stem leaves -->
  <!-- Leaf 4 (base upper) -->
  <path d="M 138,29 C 136,18 126,14 118,18 C 115,24 122,32 130,31 Z" fill="#852834" fill-opacity="0.14" stroke="#852834" stroke-width="1.2"/>
  <path d="M 134,27 Q 126,22 121,19" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 5 (base lower) -->
  <path d="M 128,31 C 126,42 116,46 108,43 C 105,37 113,30 122,30 Z" fill="#852834" fill-opacity="0.14" stroke="#852834" stroke-width="1.2"/>
  <path d="M 124,33 Q 116,38 111,41" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 6 (mid upper) -->
  <path d="M 72,43 C 66,32 54,30 46,35 C 44,42 52,48 62,46 Z" fill="#852834" fill-opacity="0.18" stroke="#852834" stroke-width="1.2"/>
  <path d="M 69,42 Q 58,37 50,37" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Lower branch leaves -->
  <!-- Leaf 7 (lower mid) -->
  <path d="M 58,56 C 54,66 44,72 36,68 C 34,62 41,55 50,54 Z" fill="#852834" fill-opacity="0.16" stroke="#852834" stroke-width="1.2"/>
  <path d="M 55,58 Q 46,64 40,67" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Leaf 8 (lower terminal) -->
  <path d="M 36,72 C 32,82 22,86 16,82 C 14,75 22,70 30,70 Z" fill="#852834" fill-opacity="0.2" stroke="#852834" stroke-width="1.2"/>
  <path d="M 33,73 Q 25,78 19,80" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Terminal leaf on main stem -->
  <path d="M 12,74 C 2,74 -6,80 -4,86 C 2,90 10,84 12,78 Z" fill="#852834" fill-opacity="0.24" stroke="#852834" stroke-width="1.2"/>
  <path d="M 10,76 Q 2,79 -2,84" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Delicate accent buds -->
  <circle cx="100" cy="34" r="1.8" fill="#852834"/>
  <circle cx="54" cy="47" r="1.6" fill="#852834"/>
</svg>
