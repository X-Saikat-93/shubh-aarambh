<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" fill="none">
  <!-- Central botanical bud pointing upward -->
  <path d="M 90,6 C 87,14 84,24 90,32 C 96,24 93,14 90,6 Z" fill="#852834" fill-opacity="0.22" stroke="#852834" stroke-width="1.2"/>
  <path d="M 90,8 L 90,30" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Left flank leaf -->
  <path d="M 88,22 C 78,16 66,18 64,26 C 72,28 82,26 88,22 Z" fill="#852834" fill-opacity="0.18" stroke="#852834" stroke-width="1.2"/>
  <path d="M 86,22 Q 76,21 68,25" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Right flank leaf -->
  <path d="M 92,22 C 102,16 114,18 116,26 C 108,28 98,26 92,22 Z" fill="#852834" fill-opacity="0.18" stroke="#852834" stroke-width="1.2"/>
  <path d="M 94,22 Q 104,21 112,25" stroke="#852834" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Left horizontal graceful tendril with leaves -->
  <path d="M 86,30 C 65,33 45,28 25,32 C 16,34 8,40 2,44" stroke="#852834" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- Left tendril leaf 1 -->
  <path d="M 58,30 C 52,24 40,24 38,30 C 44,34 52,32 58,30 Z" fill="#852834" fill-opacity="0.16" stroke="#852834" stroke-width="1.1"/>
  <!-- Left tendril leaf 2 -->
  <path d="M 38,30 C 32,36 22,36 18,32 C 24,28 32,28 38,30 Z" fill="#852834" fill-opacity="0.16" stroke="#852834" stroke-width="1.1"/>
  <!-- Left curling terminal tip -->
  <path d="M 8,39 C 4,42 2,46 5,48 C 8,49 11,46 10,43" stroke="#852834" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Right horizontal graceful tendril with leaves -->
  <path d="M 94,30 C 115,33 135,28 155,32 C 164,34 172,40 178,44" stroke="#852834" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- Right tendril leaf 1 -->
  <path d="M 122,30 C 128,24 140,24 142,30 C 136,34 128,32 122,30 Z" fill="#852834" fill-opacity="0.16" stroke="#852834" stroke-width="1.1"/>
  <!-- Right tendril leaf 2 -->
  <path d="M 142,30 C 148,36 158,36 162,32 C 156,28 148,28 142,30 Z" fill="#852834" fill-opacity="0.16" stroke="#852834" stroke-width="1.1"/>
  <!-- Right curling terminal tip -->
  <path d="M 172,39 C 176,42 178,46 175,48 C 172,49 169,46 170,43" stroke="#852834" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Center base droplet / diamond bead -->
  <circle cx="90" cy="33" r="2.2" fill="#852834"/>
  <circle cx="90" cy="40" r="1.4" fill="#852834"/>
</svg>
